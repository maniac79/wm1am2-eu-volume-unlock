name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # The shipped launcher (START-windows.bat) starts powershell.exe, which on
  # Windows is Windows PowerShell 5.1. Testing only under pwsh would leave that
  # path unverified, so both hosts are exercised explicitly. Neither job is
  # physical-device validation: the adb is simulated.
  windows-powershell51:
    name: Windows / Windows PowerShell 5.1 (simulated adb, no device)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Host version
        shell: powershell
        run: |
          $PSVersionTable.PSVersion.ToString()
          $PSVersionTable.PSEdition

      - name: Parse all PowerShell scripts (5.1 parser)
        shell: powershell
        run: |
          $files = @(
            'tools/nvptool.ps1',
            'tools/inject.ps1',
            'packaging/windows/menu.ps1',
            'tests/host/fakebin-ps/fake-adb.ps1',
            'tests/windows/run_tests.ps1'
          )
          $bad = $false
          foreach ($f in $files) {
            $errs = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $PWD $f), [ref]$null, [ref]$errs)
            if ($errs) {
              foreach ($e in $errs) { Write-Host "::error file=$f::$($e.Message)" }
              $bad = $true
            }
          }
          if ($bad) { exit 1 }
          Write-Host 'All PowerShell scripts parse under 5.1.'

      # Includes the launcher -> menu -> orchestrator path, which is why this
      # job exists at all.
      - name: Orchestration tests under Windows PowerShell 5.1
        shell: powershell
        run: |
          ./tests/windows/run_tests.ps1 -PowerShellHost powershell

  windows-pwsh:
    name: Windows / PowerShell 7+ (simulated adb, no device)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Host version
        shell: pwsh
        run: |
          $PSVersionTable.PSVersion.ToString()
          $PSVersionTable.PSEdition

      - name: Parse all PowerShell scripts (7 parser)
        shell: pwsh
        run: |
          $files = @(
            'tools/nvptool.ps1',
            'tools/inject.ps1',
            'packaging/windows/menu.ps1',
            'tests/host/fakebin-ps/fake-adb.ps1',
            'tests/windows/run_tests.ps1'
          )
          $bad = $false
          foreach ($f in $files) {
            $errs = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $PWD $f), [ref]$null, [ref]$errs)
            if ($errs) {
              foreach ($e in $errs) { Write-Host "::error file=$f::$($e.Message)" }
              $bad = $true
            }
          }
          if ($bad) { exit 1 }
          Write-Host 'All PowerShell scripts parse.'

      - name: Orchestration tests under PowerShell 7
        shell: pwsh
        run: |
          ./tests/windows/run_tests.ps1 -PowerShellHost pwsh

  linux-bash:
    name: Linux (bash suites, simulated adb, no device)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Java payload tests (mock HAL)
        run: ./tests/host/run_java_tests.sh

      - name: Bash host tests (fake adb)
        run: ./tests/host/run_shell_tests.sh

      - name: Documentation consistency (menus vs QUICKSTART vs README vs code)
        run: ./tests/docs/check_docs.sh
